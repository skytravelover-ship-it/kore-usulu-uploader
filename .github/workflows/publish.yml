name: Instagram publish

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay a few minutes)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always the latest state.json, even if this run waited in the queue
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish due posts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST || 'graph.instagram.com' }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/posts
        run: python3 publish.py
      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "instagram-bot"
            git config user.email "instagram-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Record published posts"
            git push
          fi
