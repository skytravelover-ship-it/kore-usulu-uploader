name: Instagram cleanup (one-off)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = list only, 0 = delete"
        default: "1"

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST || 'graph.instagram.com' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 delete_dupes.py
